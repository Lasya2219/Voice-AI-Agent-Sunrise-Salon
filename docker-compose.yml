services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunrise_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    restart: unless-stopped

  voice-agent:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile
    container_name: sunrise_voice_agent
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BACKEND_URL=http://backend:8000
      - BUSINESS_SLUG=${BUSINESS_SLUG:-sunrise-salon}
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sunrise_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_BUSINESS_SLUG=${BUSINESS_SLUG:-sunrise-salon}
    depends_on:
      - backend
    restart: unless-stopped
